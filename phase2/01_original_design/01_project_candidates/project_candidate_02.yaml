project_codename: 《无声巡夜社》
genre_direction: 近代都市诡异 / 职业成长 / 普通人冰山视角
core_reader_promise: 在一个“声音会留下债务”的城市里，主角以低调职业身份处理失控事件；读者获得的是日常秩序下的恐怖、职业晋升的实用爽点和身份隔离带来的智斗安全感。
selected_mechanism_ids:
  main:
    - GMZZ-M1
    - GMZZ-M2
    - DPCQ-M4
  auxiliary:
    - FRXXZ-M3
    - QM-M3
    - GZR-M3
  constraint:
    - GMZZ-M3
    - DPCQ-M2
mechanism_combination_logic:
  - 主轴：GMZZ-M1 转化为“在失声事故档案旁恢复意识”的谜题开端；GMZZ-M2 维持早餐、租房、工作考勤与诡异风险并置；DPCQ-M4 把成长做成巡夜、验声、封缄、调律等职业资格。
  - 辅助：FRXXZ-M3 转化为优先封锁、威慑、隔离而非击杀异常；QM-M3 转化为一枚普通检修章触发失落城市声学真相；GZR-M3 让官方、商会、慈善团体都用“保护市民”的道德叙事包装利益。
  - 约束：GMZZ-M3 规定能力升级必须消化声音债务；DPCQ-M2 把一次公开事故调查设为期限压力。
  - 五层原创转化：外观从修仙/蒸汽神秘替换为声学债务、巡夜职业和封缄技术；因果从穿越或退阶改为城市失声灾害后的职业责任；代价从魔药污染或斗气消耗改为声音损耗、名字失真、听觉幻债；社会结构从教会/宗门替换为市政巡夜社、剧院财团、慈善听诊会、无声贫民区；情绪反馈从英雄打怪改为“把普通日常保住一天”的克制安全感。
original_world_premise: 城市里的每一句话都会在不可见的声层留下债务。富人购买消音保险，穷人被迫住进无声区。巡夜社负责处理失控回声、假名污染与群体失语，但它也被市政和剧院资本共同操控。
protagonist_initial_condition: 主角是巡夜社低级检修员，被卷入一份无人能签收的失声事故档案。公开记录显示他只是事故幸存者，隐藏状态则是能听到“未被说出口的欠债声”。
core_conflict_engine: 城市把语言权力商品化，失声区居民逐步被排除在法律与交易之外。主角必须在职业体系内升级，查清失声事故与城市声层债务的关系，同时避免被官方定性为污染源。
power_or_growth_system: 成长系统为职业执照制：听差、封缄员、巡夜员、验声师、调律官、静默仲裁者。每级不是单纯战力，而是能处理更复杂的声音债务与身份污染。
resource_constraint: 资源包括可用声音时长、真名完整度、封缄纸、听证席位、无声区通行证、未污染录音。使用越多，越可能让自身语言能力缺损。
hidden_state_or_public_mask: 公开面具是循规蹈矩的检修员；隐藏状态是事故档案的活体索引。主角需在官方档案身份、民间维修身份和匿名举报身份之间隔离风险。
risk_control_or_evasion_logic: 优先封场、撤离普通人、使用制度程序冻结敌方行动；能用职业规则威慑就不直接冲突，能让不同机构互相审查就不亲自暴露。
backlash_or_cost_model: 能力使用会产生声债：失去某段记忆的发音、无法说出某人称呼、被他人误听为危险语句，严重时公开身份会从档案中被静音。
faction_or_social_pressure: 市政要稳定，剧院财团要垄断声音资产，慈善听诊会要用救济换信徒式依附，无声区居民要恢复发声权，巡夜社内部派系要主角背锅。
originality_risk_notes: 风险点是案发开局、日常恐怖与职业序列可能接近既有诡秘题材；规避方式是核心规则改为“声音债务”和城市语言权，职业结构、社会矛盾、代价模型全部原创，不使用任何原著序列、仪式、塔罗、教会或专名。
why_it_is_not_a_copy_of_source_books: 该候选不复刻任何原著主角路径；职业成长来自城市公共服务与声学债务，不是修炼、炼药、魔药或蛊。羞辱期限被替换为事故听证期限，道德包装被替换为城市治理叙事。
book_dna_mapping_notes: 映射 BookDNA：level_system=巡夜职业执照；zero_sum_constraints=声音时长/真名完整度/听证席位；world_lore=声层债务和语言权商品化。
narrative_dna_mapping_notes: 映射 NarrativeDNA：开局为事故档案谜题；日常工作与异常处理交替；阶段节点为听证、封场、资格考核、无声区危机；压迫释放比偏中等，强调调查兑现。
state_ledger_mapping_notes: 映射 StateLedger：true_profile=活体索引；public_mask=低级检修员；inventory=封缄纸、未污染录音、听证凭证；faction_reputation=巡夜社/市政/剧院财团/无声区。
