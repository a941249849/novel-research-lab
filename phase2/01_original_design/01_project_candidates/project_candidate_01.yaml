project_codename: 《潮汐税簿》
genre_direction: 生态灾变玄幻 / 制度博弈 / 群体存续
core_reader_promise: 看一个低位记录员在天灾税制与族群债务中，把个人成长转化为整城续命方案；爽点不是横推，而是用规则、资源和隐秘状态扭转被收割的秩序。
selected_mechanism_ids:
  main:
    - GMZZ-M3
    - RDZZ-M3
    - GZR-M2
  auxiliary:
    - FRXXZ-M2
    - ZT-M2
    - GMZZ-M4
  constraint:
    - GZR-M4
    - FRXXZ-M4
mechanism_combination_logic:
  - 主轴：GMZZ-M3 将成长绑定为“每次使用规则能力都留下污染账”；RDZZ-M3 要求主角每次升级都必须反哺其共同体；GZR-M2 负责让主角通过税制、配给、灾害指标的漏洞求生。
  - 辅助：FRXXZ-M2 转化为一套只会在灾后缓慢增殖的隐秘记录资产；ZT-M2 转化为旧纪元城市遗骸中的资源坟场；GMZZ-M4 转化为合法身份、民间身份、审计身份的隔离。
  - 约束：GZR-M4 转化为“概率债务反噬”，越精密的套利越容易引来异常潮汐；FRXXZ-M4 要求高危灾期先撤离、留证、保种，而不是硬战。
  - 五层原创转化：外观从修仙/神秘物替换为潮汐税簿、灾害指标和生态债；因果从个人夺宝改为城市财政与生态偿还；代价从单纯受伤改为污染账、配额削减和记忆缺页；社会结构从宗门/教会改为堤坝城邦、审计署、盐民公社；情绪反馈从打脸/探秘转为“救下一批人但欠下更大账”的压迫型成就感。
original_world_premise: 世界被周期性“黑潮”侵蚀，城邦以灾害税、生命配额、盐田债券维持堤坝与人口。旧纪元沉没都市会在退潮窗口短暂露出，其中保存的不是宝物传说，而是失效制度、被封存的生态算法和可被重新激活的民生资源。
protagonist_initial_condition: 主角是低阶灾税记录员，出身欠税盐户，公开身份只能做账与勘灾；真实优势是能看到每条灾税记录背后的“未结因果”，但每次修改都会让自己承担一部分城市债务。
core_conflict_engine: 城邦上层把黑潮当作控制民众与转嫁债务的工具，外部财团垄断堤坝材料，底层公社则随时可能被牺牲。主角需要在不暴露异常能力的前提下，找出旧纪元制度遗产，重构资源分配。
power_or_growth_system: 成长不是境界名堆叠，而是“账权层级”：能看见个人账、街区账、行业账、城邦账、潮汐源账。每升一层，主角能改写更大范围的规则，但也必须承担更高的反噬审计。
resource_constraint: 核心资源为退潮时间、堤坝材料、洁净盐、无污染档案页、可迁移人口名额。任何资源都可被账面调配，但账面平衡不等于真实安全。
hidden_state_or_public_mask: 公开面具是谨慎、服从、低阶的灾税小吏；隐藏状态是能够读取“未结因果账”的异常审计者。多重身份用于隔离审计署、民间公社和走私线。
risk_control_or_evasion_logic: 优先留证、分散资产、转移民众、制造合法程序；只有在敌人进入主角预设的财政/生态规则框架后，才进行反向围猎。
backlash_or_cost_model: 每一次违规改账都会产生潮汐债：身体盐化、记忆缺页、亲友配额被系统抽查、城市某处灾害概率上升。主角不能无成本救世。
faction_or_social_pressure: 审计署要求服从数字，堤坝财团要求维持利润，盐民公社要求立刻救命，旧纪元守密者要求不公开真相，各方都会把主角推向不同道德叙事。
originality_risk_notes: 风险点是“隐秘资产长期复利”和“规则污染升级”容易被误写成既有道具/魔药结构；处理方式是不用任何原著道具、境界、组织名，不写神秘仪式场景，把核心冲突落在生态财政与公共资源治理。
why_it_is_not_a_copy_of_source_books: 该候选不使用修仙宗门、退婚、星空古路、灰雾会议、蛊虫、古棺、原著人物或原著事件顺序；机制来源被拆解为资源、制度、污染、避战、身份隔离五类功能，并重组到原创生态税制世界。
book_dna_mapping_notes: 映射 BookDNA：level_system=账权层级；zero_sum_constraints=退潮窗口/洁净盐/无污染档案页；world_lore=黑潮生态债与城邦财政制度。
narrative_dna_mapping_notes: 映射 NarrativeDNA：开局压迫来自欠税与灾害指标；中段通过旧城退潮窗口形成副本；高潮通过合法程序反围猎；释放节奏偏长期压迫、阶段性救民兑现。
state_ledger_mapping_notes: 映射 StateLedger：true_profile=异常审计者；public_mask=低阶灾税记录员；inventory=无污染档案页、旧城账钥、民众迁移名单；faction_reputation=审计署/公社/财团/守密者动态变化。
