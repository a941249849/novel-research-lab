project_codename: 《群岛无名碑》
genre_direction: 海洋史诗玄幻 / 族群迁徙 / 记忆代价成长
core_reader_promise: 看一个没有姓名继承权的岛民，在迁徙、竞渡和失落碑文中，为被抹名的群岛争取未来；爽点来自族群重命名、航路竞赛和以代价换回共同记忆。
selected_mechanism_ids:
  main:
    - QM-M2
    - RDZZ-M1
    - ZT-M4
  auxiliary:
    - RDZZ-M2
    - FRXXZ-M1
    - DPCQ-M2
  constraint:
    - GZR-M5
    - QM-M5
mechanism_combination_logic:
  - 主轴：QM-M2 转化为“无姓名继承权”的内在伤口；RDZZ-M1 把个人困境置于群岛被抹名的大背景；ZT-M4 转化为跨海竞渡与岛链淘汰。
  - 辅助：RDZZ-M2 转化为能解读失落碑文的传承火种；FRXXZ-M1 塑造贫寒海民的风险敏感；DPCQ-M2 以即将到来的群岛命名审判提供期限驱动。
  - 约束：GZR-M5 将终极冲突设为“谁拥有命名世界的底层权力”；QM-M5 规定最高圆满可能要求主角放弃自己的名字来换回群岛众名。
  - 五层原创转化：外观从修仙/蛮族/星空替换为群岛、潮碑、航图、命名权；因果从个人证道或族群血脉改为殖民式命名系统造成的历史抹除；代价从战力损耗改为名字、记忆、航路坐标的消失；社会结构从宗门/古族替换为群岛议会、测名院、海贸同盟、无名渔户；情绪反馈从称霸或复仇转为“恢复共同体名分但个人被遗忘”的悲壮回收。
original_world_premise: 群岛世界中，名字是法律、航路、祭祀与贸易的通行凭证。中央测名院每隔一纪重新审定岛屿与族群名称，未通过者会从地图、契约和记忆中逐渐消失。无名碑散落在风暴海沟，据说记录着被删除的旧名。
protagonist_initial_condition: 主角来自无名渔户，只能继承编号不能继承姓名。他熟悉暗礁和贫民航路，却没有进入正式航海学院的资格；唯一异常是能在废碑上读到被擦除的名字残影。
core_conflict_engine: 测名院即将进行新一轮审定，多个小岛面临被并名、除名和迁走。主角必须通过跨岛竞渡、碑文解读、隐秘结盟和资源保全，让无名者重新进入世界账册。
power_or_growth_system: 成长系统为“名痕刻度”：认得个人名、家族名、岛名、航路名、海域名、世界底名。每提升一阶，就能唤回更大范围的记忆与权利，但也会磨损自己的姓名。
resource_constraint: 关键资源为完整旧名、风暴季航窗、可刻碑石材、证名席位、避难船额、未被改写的口述记忆。资源越公开，越容易被测名院收编或删除。
hidden_state_or_public_mask: 公开面具是无名渔户和临时领航员；隐藏状态是旧名读碑者。主角需避免被测名院识别为非法命名源。
risk_control_or_evasion_logic: 先保船、保人、保口述记忆，再争取公开命名；面对强敌优先绕航、伪造天气窗口、借海贸规则拖延，避免在未留根前正面对抗。
backlash_or_cost_model: 每唤回一个被删除的名字，主角自己的名字会缺失一笔，严重时亲友会短暂忘记他；若强行唤回岛名，可能丢失某条返乡航线记忆。
faction_or_social_pressure: 测名院掌握合法性，海贸同盟掌握船和粮，群岛议会害怕连坐，无名渔户急需救援，旧碑守望者坚持真相不能被制度化。
originality_risk_notes: 风险点是族群复兴、资格缺失、悲情献祭容易接近既有玄幻情绪结构；规避方式是完全改写为海洋命名权制度，不使用血脉、蛮像、星空古路、宗门证道等原著结构，并把终局代价限定为姓名与记忆权。
why_it_is_not_a_copy_of_source_books: 该候选没有复用任何原著人物、道具、组织、境界或事件顺序；多书机制被拆为资格伤口、弱族压力、竞渡地图、传承解读、底层规则、代价圆满六类，再重组为原创海洋法权叙事。
book_dna_mapping_notes: 映射 BookDNA：level_system=名痕刻度；zero_sum_constraints=证名席位/风暴航窗/完整旧名；world_lore=命名权、群岛法权、无名碑与迁徙压力。
narrative_dna_mapping_notes: 映射 NarrativeDNA：开局压迫为无姓名资格；中段为岛链竞渡和碑文解读；高潮为审名席位争夺；终局保留主角是否自我缺席的审查点。
state_ledger_mapping_notes: 映射 StateLedger：true_profile=旧名读碑者；public_mask=无名领航员；inventory=旧名碎片、口述记忆、避难船额、风暴航图；faction_reputation=测名院/海贸同盟/群岛议会/无名渔户。
